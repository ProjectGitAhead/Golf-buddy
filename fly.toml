# Hosted copy on Fly.io (plan section 14). Deployed by .github/workflows/fly.yml.
app = "projectgitahead-golf-buddy"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

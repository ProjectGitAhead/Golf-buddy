# Builds the hosted copy and deploys it to Fly.io. Plan section 14.
# Owner setup: add the repository secret FLY_API_TOKEN (see README, "Hosted copy").
name: Fly deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy
  cancel-in-progress: false

env:
  FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Read the deploy token
        env:
          RAW_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$RAW_TOKEN" ]; then echo "::error::Add the FLY_API_TOKEN repository secret (see README)"; exit 1; fi
          CLEAN=$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n\t' | sed -E 's/^ +//; s/ +$//')
          case "$CLEAN" in FlyV1fm2_*) CLEAN="FlyV1 ${CLEAN#FlyV1}" ;; esac
          CLEAN=$(printf '%s' "$CLEAN" | sed -E 's/ +/ /g; s/ ?, ?/,/g')
          if LC_ALL=C printf '%s' "$CLEAN" | LC_ALL=C grep -q '[^ -~]'; then
            echo "::error::The FLY_API_TOKEN secret contains unexpected characters. Paste the token again as one line."
            exit 1
          fi
          echo "::add-mask::$CLEAN"
          echo "FLY_API_TOKEN=$CLEAN" >> "$GITHUB_ENV"
          if [ "$CLEAN" = "$RAW_TOKEN" ]; then CHANGED=no; else CHANGED=yes; fi
          echo "Cleaning changed the token: $CHANGED"
          echo "Cleaned token length: ${#CLEAN}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create the app if it does not exist yet
        run: |
          APP=$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)
          if out=$(flyctl status --app "$APP" 2>&1); then
            echo "App exists"
          else
            echo "flyctl status failed:"
            echo "$out"
            if ! flyctl apps create "$APP" --org "$FLY_ORG"; then
              echo "::error::Could not find or create the Fly app $APP. Either create it once yourself (fly apps create $APP) and use a token that covers it, or use an organisation token (fly tokens create org) and set the repository variable FLY_ORG to that organisation's slug (fly orgs list). See README, Hosted copy."
              exit 1
            fi
          fi
      - run: flyctl deploy --remote-only --ha=false

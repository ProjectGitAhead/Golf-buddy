# Builds the hosted copy and deploys it to Fly.io. Plan section 14.
# Owner setup: add the repository secret FLY_API_TOKEN (see README, "Hosted copy").
name: Fly deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Fly after building
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: fly-deploy
  cancel-in-progress: false

env:
  FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Read the deploy token
        env:
          RAW_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$RAW_TOKEN" ]; then echo "::error::Add the FLY_API_TOKEN repository secret (see README)"; exit 1; fi
          CLEAN=$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n\t' | sed -E 's/^ +//; s/ +$//')
          case "$CLEAN" in FlyV1fm2_*) CLEAN="FlyV1 ${CLEAN#FlyV1}" ;; esac
          CLEAN=$(printf '%s' "$CLEAN" | sed -E 's/ +/ /g; s/ ?, ?/,/g')
          if LC_ALL=C printf '%s' "$CLEAN" | LC_ALL=C grep -q '[^ -~]'; then
            echo "::error::The FLY_API_TOKEN secret contains unexpected characters. Paste the token again as one line."
            exit 1
          fi
          if ! printf '%s' "$CLEAN" | grep -Eq '^(FlyV1 fm[0-9]_|fo1_|fm2_)'; then
            echo "::error::The FLY_API_TOKEN secret does not look like a Fly token (it should start with FlyV1). Paste the token itself, not a command, as one line."
            exit 1
          fi
          echo "::add-mask::$CLEAN"
          echo "FLY_API_TOKEN=$CLEAN" >> "$GITHUB_ENV"
          if [ "$CLEAN" = "$RAW_TOKEN" ]; then CHANGED=no; else CHANGED=yes; fi
          echo "Cleaning changed the token: $CHANGED"
          echo "Cleaned token length: ${#CLEAN}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bake in green positions from OpenStreetMap (never fails the job)
        continue-on-error: true
        run: node scripts/fetch-greens.mjs rancho-solano || true
      - name: Save green positions to the repository
        continue-on-error: true
        run: |
          F=src/data/courses/rancho-solano.greens.json
          if git diff --quiet -- "$F"; then
            echo "Green positions unchanged, nothing to save"
            exit 0
          fi
          HOLES='try{const j=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(JSON.stringify(j.holes||{}))}catch(e){console.log("{}")}'
          COUNT='console.log(Object.keys(JSON.parse(require("fs").readFileSync(0,"utf8"))).length)'
          NEW_HOLES=$(node -e "$HOLES" < "$F")
          OLD_HOLES=$(git show "HEAD:$F" | node -e "$HOLES")
          if [ "$NEW_HOLES" = "$OLD_HOLES" ]; then
            git checkout -- "$F"
            echo "Green positions unchanged, nothing to save"
            exit 0
          fi
          NEW=$(printf '%s' "$NEW_HOLES" | node -e "$COUNT")
          OLD=$(printf '%s' "$OLD_HOLES" | node -e "$COUNT")
          if [ "$NEW" -lt "$OLD" ]; then
            git checkout -- "$F"
            echo "Kept the existing green positions file because the new one has fewer holes ($NEW, was $OLD)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$F"
          git commit -m "Update Rancho Solano green positions from OpenStreetMap" -- "$F"
          if git push origin HEAD:${{ github.ref_name }}; then
            echo "Saved green positions for $NEW holes to the repository"
          else
            echo "Push failed, green positions were not saved (the deploy continues)"
          fi
      - run: npm run build
      - name: Check green positions are available
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
        run: |
          F=src/data/courses/rancho-solano.greens.json
          N=$(node -e 'try{console.log(Object.keys(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).holes||{}).length)}catch(e){console.log(0)}' "$F")
          if [ "$N" -eq 0 ]; then
            echo "::error::No green positions are available for Rancho Solano (the map lookup failed and none are saved in the repository). Not deploying, so the live site keeps its current data."
            exit 1
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
      - name: Create the app if it does not exist yet
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
        run: |
          APP=$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)
          case "$FLY_API_TOKEN" in
            "FlyV1 "*) AUTH="$FLY_API_TOKEN" ;;
            *) AUTH="Bearer $FLY_API_TOKEN" ;;
          esac
          GET_BODY=$(mktemp)
          POST_BODY=$(mktemp)
          GET_CODE=$(curl -sS --max-time 30 -o "$GET_BODY" -w '%{http_code}' \
            -H "Authorization: $AUTH" "https://api.machines.dev/v1/apps/$APP") || GET_CODE=000
          if [ "$GET_CODE" = "200" ]; then
            echo "App exists"
            exit 0
          fi
          PAYLOAD=$(jq -n --arg app "$APP" --arg org "$FLY_ORG" '{app_name: $app, org_slug: $org}')
          POST_CODE=$(curl -sS --max-time 30 -o "$POST_BODY" -w '%{http_code}' \
            -X POST -H "Authorization: $AUTH" -H "Content-Type: application/json" \
            -d "$PAYLOAD" "https://api.machines.dev/v1/apps") || POST_CODE=000
          if [ "$POST_CODE" = "200" ] || [ "$POST_CODE" = "201" ]; then
            echo "App created"
            exit 0
          fi
          echo "Lookup HTTP $GET_CODE:"
          cat "$GET_BODY"; echo
          echo "Create HTTP $POST_CODE:"
          cat "$POST_BODY"; echo
          echo "::error::Could not find or create the Fly app $APP (lookup HTTP $GET_CODE, create HTTP $POST_CODE). If the token is valid, set the repository variable FLY_ORG to your Fly organisation's slug (shown in the Fly dashboard URL). See README, Hosted copy."
          exit 1
      - run: flyctl deploy --remote-only --ha=false
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}

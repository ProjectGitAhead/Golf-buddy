# Static server for the hosted copy. Plan section 14.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self)" always;

    location = /index.html { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; add_header Permissions-Policy "geolocation=(self), camera=(self)" always; }
    location = /sw.js { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; add_header Permissions-Policy "geolocation=(self), camera=(self)" always; }
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; add_header Permissions-Policy "geolocation=(self), camera=(self)" always; }
    location ~* \.png$ { add_header Cache-Control "public, max-age=86400" always; add_header X-Content-Type-Options "nosniff" always; add_header Permissions-Policy "geolocation=(self), camera=(self)" always; }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self)" always;
        try_files $uri $uri/ =404;
    }
}

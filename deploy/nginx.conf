# Static server for the hosted copy (plan section 14), plus the map lookup endpoint /api/osm (plan section 16.2).
# The image copies this file to /etc/nginx/conf.d/default.conf, which the stock nginx.conf includes inside its
# `http` block: the three directives before `server` belong to that `http` context.
# `scripts/check-nginx.mjs` runs this file through `nginx -t` and a local fail-over / cache / limit test.

# Good Overpass answers, kept on disk for a day (see the note at proxy_cache_valid below).
proxy_cache_path /var/cache/nginx/osm levels=1:2 keys_zone=osm:4m max_size=256m inactive=30d use_temp_path=off;
# Fly passes the phone's address in Fly-Client-IP (the connection itself comes from Fly's proxy).
map $http_fly_client_ip $osm_client { "" $binary_remote_addr; default $http_fly_client_ip; }
limit_req_zone $osm_client zone=osm_rate:2m rate=6r/m;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self)" always;
    add_header X-Cache-Status $upstream_cache_status always;

    # ----- /api/osm: the app's Overpass query, forwarded to the public servers in order -----------------------------
    # Request bodies: only /api/osm takes one. The whole body is held in one memory buffer, so $request_body (the
    # cache key) is always the complete query: anything larger than the buffer is refused with 413.
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_body_in_single_buffer on;

    # Upstream names are resolved when asked (they are in variables), so a server's new address is picked up and
    # `nginx -t` needs no network. Fly's internal resolver first; nginx asks the listed resolvers in turn.
    resolver [fdaa::3]:53 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Settings every Overpass server location below inherits.
    proxy_http_version 1.1;
    proxy_ssl_server_name on;          # SNI = the host in proxy_pass; Host defaults to the same name
    proxy_set_header User-Agent "GolfBuddy/0.1 (+github.com/ProjectGitAhead/Golf-buddy)";
    proxy_set_header Accept-Encoding "";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_set_header Origin "";
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 25s;            # the query asks for 20 s, so a server answers (or says it ran out) first
    proxy_intercept_errors on;         # an upstream 406 / 429 / 5xx goes to the next server via error_page
    recursive_error_pages on;          # @osm2 may hand on to @osm3, and so on

    proxy_cache osm;
    proxy_cache_methods POST;
    proxy_cache_key "osm|$request_body";
    # 1 day, not 30: Overpass answers 200 with a "runtime error" remark when a query runs out of time, and nginx can't
    # see that without reading the body. The app treats such an answer as a failure and asks the public servers.
    proxy_cache_valid 200 1d;
    proxy_cache_use_stale error timeout http_429 http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary X-Accel-Expires;
    proxy_hide_header Set-Cookie;

    location = /api/osm {
        if ($request_method != POST) { return 405; }
        limit_req zone=osm_rate burst=5 nodelay;
        limit_req_status 429;
        # Never a file: hands the request (method and body intact) to the first server, after the rate limit.
        try_files /.api-osm-is-not-a-file @osm1;
    }
    location @osm1 {
        error_page 406 429 500 502 503 504 = @osm2;
        set $osm_host overpass-api.de;
        proxy_pass https://$osm_host/api/interpreter;
    }
    location @osm2 {
        error_page 406 429 500 502 503 504 = @osm3;
        set $osm_host overpass.private.coffee;
        proxy_pass https://$osm_host/api/interpreter;
    }
    location @osm3 {
        error_page 406 429 500 502 503 504 = @osm4;
        set $osm_host overpass.kumi.systems;
        proxy_pass https://$osm_host/api/interpreter;
    }
    location @osm4 {
        proxy_intercept_errors off;    # the last server's own answer goes back to the phone as it is
        set $osm_host maps.mail.ru;
        proxy_pass https://$osm_host/osm/tools/overpass/api/interpreter;
    }

    # ----- the site ------------------------------------------------------------------------------------------------
    location = /index.html { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; add_header Permissions-Policy "geolocation=(self), camera=(self)" always; }
    location = /sw.js { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; add_header Permissions-Policy "geolocation=(self), camera=(self)" always; }
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; add_header Permissions-Policy "geolocation=(self), camera=(self)" always; }
    location ~* \.png$ { add_header Cache-Control "public, max-age=86400" always; add_header X-Content-Type-Options "nosniff" always; add_header Permissions-Policy "geolocation=(self), camera=(self)" always; }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self)" always;
        try_files $uri $uri/ =404;
    }
}
